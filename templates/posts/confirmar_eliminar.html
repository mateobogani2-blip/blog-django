{% extends "base.html" %}

{% block titulo %}Eliminar post · Blog Django{% endblock %}

{% block contenido %}
<div class="mx-auto contenido-angosto">
  <h1 class="h3">Eliminar post</h1>
  <p>¿Seguro que querés eliminar <strong>"{{ post.titulo }}"</strong>? Esta acción no se puede deshacer.</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
